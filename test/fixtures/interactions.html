<!doctype html>
<html>
<head><meta charset="utf-8"><title>Interactions</title>
<style>body{height:2000px} #hover-menu{display:none}</style>
</head>
<body>
<input id="name" name="name" placeholder="Your name"><br>
<select id="sel">
  <option value="a">A</option>
  <option value="b">B</option>
  <option value="c">C</option>
</select><br>
<button id="hover-target">hover me</button>
<div id="hover-menu"><button id="menu-btn">menu item</button></div><br>
<input type="file" id="upload"><br>
<div id="ctx-target" style="width:200px;height:40px;border:1px solid #000">right-click me</div>
<div id="log"></div>
<script>
  var log = document.getElementById('log');
  function add(s) { log.textContent += s + ';'; }
  document.getElementById('sel').addEventListener('change', function (e) { add('select:' + e.target.value); });
  document.getElementById('hover-target').addEventListener('mouseover', function () { document.getElementById('hover-menu').style.display = 'block'; add('hover'); });
  document.getElementById('menu-btn').addEventListener('click', function () { add('menu-click'); });
  document.getElementById('upload').addEventListener('change', function (e) { add('upload:' + (e.target.files[0] ? e.target.files[0].name : 'none')); });
  document.getElementById('ctx-target').addEventListener('contextmenu', function (e) { e.preventDefault(); add('ctx'); });
</script>
</body>
</html>
